
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veeravalan Solutions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 3rem 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      border: 1px solid #334155;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }
    .contact-link {
      display: inline-block;
      padding: 10px 20px;
      background-color: #0284c7;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }
    .contact-link:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>VeeraValan Solutions</h1>
    <p>Our new website is under construction. For inquiries, please reach out via email below.</p>
    <a href="mailto:veeravalansolutions@gmail.com" class="contact-link">veeravalansolutions@gmail.com</a>
  </div>
</body>
</html>
